    <h1>Drive X rclone</h1>
    <p>Drive X rclone은 운영자 본인의 Google Drive를 Windows 파일 탐색기에서 X: 드라이브로 연결하는 개인용 설정입니다.</p>
    <p>Windows의 rclone이 운영자의 Google 인증을 받아 드라이브의 폴더와 저장 용량을 표시합니다. 파일 탐색기에서 요청한 작업에 따라 파일을 읽거나 저장합니다. 이 홈페이지는 앱 안내를 제공하며 Google 로그인은 로컬 rclone이 시작한 연결 과정에서 진행됩니다.</p>
    <a href="privacy.html">개인정보처리방침</a>
